# ForLMS reverse proxy + static site (ELR_LMS_001/002/004)
# Copy to /etc/nginx/conf.d/forlms.conf on the SCA DC VM, then:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name lms.customs.sca.local;   # replace with the confirmed SCA hostname

    ssl_certificate     /etc/pki/tls/certs/forlms.crt;   # issued by SCA PKI
    ssl_certificate_key /etc/pki/tls/private/forlms.key;

    root /opt/forlms/frontend/dist;
    index index.html;

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # NestJS API (raised body size limit for SCORM package uploads, see
    # SCORM_MAX_PACKAGE_SIZE_MB in backend/.env.example)
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 512m;
    }

    # SCORM package content (served by the backend's ServeStaticModule)
    location /content/ {
        proxy_pass http://127.0.0.1:3000/content/;
        proxy_set_header Host $host;
        client_max_body_size 0;
    }
}

server {
    listen 80;
    server_name lms.customs.sca.local;
    return 301 https://$host$request_uri;
}
